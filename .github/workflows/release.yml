# Builds the Windows installer and puts it on the release page, every time a version tag is pushed
# (e.g. v36.0.0). The installed app checks this release page for updates.
# Test versions: tag e.g. v36.1.0-beta.1 (package.json "version": "36.1.0-beta.1"): it's marked as a
# pre-release, so only apps with "Test versions too" ticked get it.
name: Build the Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Put it on the release page (the installed apps update to it)'
        type: boolean
        default: true
      test_version:
        description: 'Test version (only apps with "Test versions too" get it)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node desktop/check-version.js
      - name: Test the app's own parts (no Electron window needed)
        run: node desktop/test/unit.js
      - name: Tag this version (when started with the Run workflow button)
        if: github.ref_type != 'tag' && inputs.publish
        shell: bash
        run: |
          V=v$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then echo "$V already tagged"; else
            git tag "$V" && git push origin "$V"; fi
          # make the (draft) release now, so the build uploads into ONE release instead of racing to create two
          if ! gh release view "$V" >/dev/null 2>&1; then
            gh release create "$V" --draft --title "$V" --notes-file build/release-notes.md $([[ "${{ inputs.test_version }}" == "true" ]] && echo --prerelease); fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        shell: bash
        run: |
          TYPE=release
          if [[ "$GITHUB_REF_NAME" == *-* || "${{ inputs.test_version }}" == "true" ]]; then TYPE=prerelease; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" || "${{ inputs.publish }}" == "true" ]]; then
            npx electron-builder --win --x64 --publish always -c.publish.releaseType=$TYPE
          else
            npx electron-builder --win --x64 --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the release live (the build leaves it as a draft)
        if: github.ref_type == 'tag' || inputs.publish
        shell: bash
        run: |
          V=v$(node -p "require('./package.json').version")
          N=$(gh release view "$V" --json assets --jq '[.assets[].name] | map(select(. == "latest.yml" or endswith(".exe"))) | length')
          if [[ "$N" -lt 2 ]]; then echo "The installer or latest.yml is missing from $V: left as a draft"; exit 1; fi
          if [[ "${{ inputs.test_version }}" == "true" || "$GITHUB_REF_NAME" == *-* ]]; then gh release edit "$V" --draft=false --prerelease; else gh release edit "$V" --draft=false --latest; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/latest.yml
