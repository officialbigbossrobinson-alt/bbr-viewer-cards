<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BBR Giveaway Spin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* v39: the giveaway spin as its own OBS Browser Source (1920 x 1080, top of your scenes).
     Pick "Its own Browser Source" in Giveaways › Giveaway list › Spin, or the BBR overlay shows it. ?force=1 always shows it. */
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
  #stage{position:absolute;inset:0}
</style>
</head>
<body>
<div id="stage"></div>
<script src="/sfx.js"></script>
<script src="/spin.js"></script>
<script>
(function () {
  const force = /force=1/.test(location.search), mute = /sound=0/.test(location.search);
  SPIN.init(document.getElementById('stage'));
  const show = (a) => { if (!force && a.where !== 'own') a = Object.assign({}, a, { phase: 'idle' }); if (mute) a = Object.assign({}, a, { sounds: false }); SPIN.event(a); };
  function load() { fetch('/api/spin').then((r) => r.json()).then(show).catch(() => setTimeout(load, 3000)); }
  load();
  try {
    const es = new EventSource('/events?page=spin');
    es.onmessage = (m) => { let a; try { a = JSON.parse(m.data); } catch (e) { return; } if (a.volume != null) try { SFX.setVolume && SFX.setVolume(a.volume); } catch (e) { /* ignore */ } if (a.type === 'spin') show(a); };
    es.onerror = () => {};
  } catch (e) { /* no live updates */ }
})();
</script>
</body>
</html>
