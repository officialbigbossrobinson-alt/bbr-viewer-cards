<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BBR Giveaway Meter</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
  /* v33: the giveaway meter as its own OBS Browser Source (1920 x 1080), for when you want it in some scenes only.
     Pick "Its own Browser Source" in Live › Giveaway meter, or the overlay shows it as well. */
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
  #stage{position:absolute;inset:0}
</style>
</head>
<body>
<div id="stage"></div>
<script src="/card.js"></script>
<script src="/sfx.js"></script>
<script src="/gmeter.js"></script>
<script>
(function () {
  const force = /force=1/.test(location.search), mute = /sound=0/.test(location.search);
  GMETER.init(document.getElementById('stage'));
  const show = (a) => { if (!force && a.where !== 'own') a = Object.assign({}, a, { on: false }); if (mute) a.sound = false; GMETER.event(a); };
  function load() { fetch('/api/gmeter').then((r) => r.json()).then(show).catch(() => setTimeout(load, 3000)); }
  load();
  try {
    const es = new EventSource('/events?page=gmeter');
    es.onmessage = (m) => { let a; try { a = JSON.parse(m.data); } catch (e) { return; } if (a.volume != null) try { SFX.setVolume && SFX.setVolume(a.volume); } catch (e) { /* ignore */ } if (a.type === 'gmeter') show(a); };
  } catch (e) { /* no live updates */ }
})();
</script>
</body>
</html>
