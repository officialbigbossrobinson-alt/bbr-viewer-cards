<style>
  /* v30 Big Cam backdrops. Two OBS Browser Sources in your Big Cam scene (1920 x 1080):
     /bigcam?layer=back  (at the bottom: the wall behind you, plays the music)
     /bigcam?layer=front (on top of your camera: the desk / table in front of you)
     Your camera sits between them with its background removed (NVIDIA Background Removal, or a green screen + Chroma Key). */
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Barlow Condensed','Arial Narrow',sans-serif}
  .lay{position:absolute;inset:0;overflow:hidden;transition:opacity .8s}
  .a{position:absolute}
  .hide{display:none!important}
  #photo{position:absolute;inset:-20px;background-size:cover;background-position:center}
  #dim{position:absolute;inset:0;background:#000}
  .np{position:absolute;right:30px;top:24px;display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:18px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px}
  @keyframes drift{to{transform:translateX(-50%)}}
  @keyframes truckby{from{transform:translateX(900px)}to{transform:translateX(-900px)}}
  @keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.25}95%{opacity:1}97%{opacity:.4}}
  @keyframes sweep{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{50%{opacity:.25}}
  @keyframes roadlines{from{background-position:0 0}to{background-position:0 160px}}
  @keyframes pulse{50%{opacity:.6}}
  @keyframes sway{50%{transform:rotate(2.5deg)}}
</style>
