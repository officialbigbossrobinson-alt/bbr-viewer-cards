<div class="left">
  <div class="kick" id="kick">TONIGHT ON BIGBOSSROBINSON</div>
  <div class="title" id="title">STARTING SOON</div>
  <div class="tonight" id="tonight"></div>
  <div class="chips" id="chips"></div>
  <div class="cd" id="cd">
  <span class="lb" id="cdl">KICK-OFF IN</span>
  <div class="box"><span class="bar"></span><span class="dig" id="dig">4:15</span></div>
  <div class="pg"><i id="pg" style="width:0%"></i></div>
  <div><span class="held hide" id="held"></span></div>
</div>
</div>
<div class="low">
  <div class="spot" id="spot"></div>
  <div class="arr" id="arr"><div class="h"><span id="arrt">ARRIVALS</span><span><b id="here">0</b> <span id="heret">IN THE BUILDING</span></span></div><div class="rows" id="arows"></div><div class="hint">Say hi in chat to check in: your card goes on the board</div></div>
</div>
<div class="chat" id="chat"><div class="h"><b id="chatt">THE TERRACE</b><span><span id="chats">LIVE CHAT</span> <small id="plats"></small></span></div><div class="list" id="list"><div class="empty" id="empty">Chat shows here with everyone's card rating. Say hi!</div></div></div>
<div id="ko"><div class="b3"></div><div class="b1"></div><div class="b2"></div><div class="t" id="kot">KICK-OFF!</div><div class="s" id="kos">WE ARE LIVE</div></div>
<script src="/card.js"></script>
<script src="/sfx.js"></script>
<script src="/music.js"></script>
<script src="/stinger.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TIER = { bronze: '#c8894f', silver: '#c9ced6', gold: '#f6d77a', legend: '#3dff9a' };
  const PL = { twitch: ['TW', '#b98cff'], kick: ['KICK', '#53fc18'], youtube: ['YT', '#ff6b6b'] };
  const pt = (p) => PL[p] ? '<em style="background:' + PL[p][1] + '">' + PL[p][0] + '</em>' : '';
  const sfx = (n, a, b) => { try { window.SFX && SFX.play(n, a, b); } catch (e) { /* no audio */ } };
  // the words for this game (sent by the app); these are only a fallback while it loads
  const WD0 = { bug: 'BOSS SPORTS NEWS · PRE-MATCH', airWait: 'PRE-MATCH', airRun: 'ON AIR SOON', airLive: 'LIVE', kick: 'TONIGHT ON BIGBOSSROBINSON', title: 'STARTING SOON', clock: 'KICK-OFF IN', clockDone: 'KICK-OFF', arrivals: 'ARRIVALS', here: 'IN THE BUILDING', chat: 'THE TERRACE', chatSub: 'LIVE CHAT', go: 'KICK-OFF!', goSub: 'WE ARE LIVE' };
  const WD = () => Object.assign({}, WD0, (st && st.words) || {});
  let ETS = false, HEIST = false, st = null, skew = 0, lastTick = -1, picIdx = 0, picT = null, picKey = '', spotI = 0, spotT = null, hold = false, alQ = [], alBusy = false, tickerOn = null;

  // ---------- background picture(s) ----------
  function bg() {
    const S = st.S, list = S.pic === 'rotate' ? S.pics : S.pic === 'bsn' ? [] : S.pics.filter((u, i) => S.picIds[i] === S.pic);
    document.body.classList.toggle('zoom', !!S.zoom);
    const key = JSON.stringify([S.pic, list, S.rotateSecs, ETS, HEIST]);
    if (key === picKey) return; picKey = key;
    clearInterval(picT); $('bg').innerHTML = '';
    if (!list.length) { const d = document.createElement('div'); if (HEIST) { d.className = 'lay on hxset'; d.innerHTML = '<div class="sun"></div><div class="city"></div><div class="win"></div><div class="sea"></div><div class="glint"></div><div class="road"></div><div class="dash"></div><div class="palm" style="left:1300px;height:520px"></div><div class="palm" style="left:1420px;height:430px;animation-delay:-2s"></div><div class="palm" style="left:1840px;height:560px;animation-delay:-4s"></div>'; } else if (ETS) { d.className = 'lay on etsset'; d.innerHTML = '<div class="hills"></div><div class="rail"></div><div class="road"></div><div class="dash"></div><div class="edge"></div><div class="post" style="left:60px"></div><div class="post" style="left:1222px"></div><div class="gantry"></div>'; } else { d.className = 'lay on bsnset'; d.innerHTML = '<div class="sw"></div><div class="sw2"></div><div class="wm">BSN</div>'; } $('bg').appendChild(d); return; }
    const lays = list.map((u) => { const d = document.createElement('div'); d.className = 'lay'; d.style.backgroundImage = 'url("' + u + '")'; $('bg').appendChild(d); return d; });
    picIdx = 0; lays[0].classList.add('on');
    if (lays.length > 1) picT = setInterval(() => { lays[picIdx].classList.remove('on'); picIdx = (picIdx + 1) % lays.length; lays[picIdx].classList.add('on'); }, S.rotateSecs * 1000);
  }
  // ---------- the countdown ----------
  const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function left() { if (!st) return 0; return st.running && st.endsAt ? Math.max(0, st.endsAt - (Date.now() + skew)) : st.left; }
  function clock() {
    if (!st) return;
    const l = left(), secs = Math.ceil(l / 1000);
    $('dig').textContent = st.ended ? '0:00' : fmt(l);
    $('dig').classList.toggle('hot', st.running && secs <= 10 && secs > 0);
    $('pg').style.width = (st.dur ? Math.min(100, 100 * (1 - l / st.dur)) : 0) + '%';
    // v32: the words follow the game you're playing (and can be changed in the dashboard)
    const W = WD();
    $('cdl').textContent = st.ended ? W.clockDone : st.running ? W.clock : st.left < st.dur && !st.ended ? 'PAUSED · ' + W.clock : W.clock;
    $('air').textContent = st.running ? W.airRun : st.ended ? W.airLive : W.airWait;
    if (st.running && secs !== lastTick) { if (secs <= 5 && secs > 0) sfx('tick'); lastTick = secs; }
  }
  setInterval(clock, 200);
  // ---------- card spotlight ----------
  let spotKey = '';
  function spot() {
    const L = (st.spot || []).filter((x) => x && x.card);
    const key = JSON.stringify([st.S.spotlight, L.map((x) => x.label + x.card.display + x.card.ovr)]);
    if (key === spotKey) return; spotKey = key;
    clearInterval(spotT);
    if (!st.S.spotlight || !L.length) { $('spot').classList.add('hide'); return; }
    $('spot').classList.remove('hide');
    const show = () => {
      const x = L[spotI % L.length], c = x.card; spotI++;
      let cardHtml = '';
      try { cardHtml = '<div class="' + BBR.wrapClass(c.tier) + '"><div class="in">' + BBR.render(c, { accent: '#f5c400' }) + '</div></div>'; } catch (e) { cardHtml = ''; }
      const s = c.stats || {}, top = Object.keys(s).sort((a, b) => s[b] - s[a]).slice(0, 3);
      $('spot').innerHTML = '<div class="cw">' + cardHtml + '</div><div class="tx"><span class="lab">' + esc(x.label) + '</span><span class="nm">' + esc(String(c.display).toUpperCase()) + '</span>' +
        '<span class="vl">OVR ' + c.ovr + ' · ' + esc(String(c.tier || '').toUpperCase()) + (x.value != null && x.unit !== 'OVR' ? ' · ' + x.value + ' ' + esc(x.unit) : '') + '</span>' +
        '<div class="st2">' + top.map((k) => '<span><b>' + s[k] + '</b> ' + esc(k) + '</span>').join('') + '</div></div>';
      $('spot').classList.remove('chg'); void $('spot').offsetWidth; $('spot').classList.add('chg');
    };
    show(); if (L.length > 1) spotT = setInterval(show, 9000);
  }
  // ---------- arrivals board ----------
  function arrRow(a) {
    const d = new Date(a.at), t = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    return '<div class="r"><span class="t">' + t + '</span><span class="n">' + esc(a.display) + '</span>' + (PL[a.platform] ? '<em style="font-style:normal;font-family:Inter,sans-serif;font-size:11px;font-weight:800;padding:2px 5px;border-radius:3px;color:#061233;background:' + PL[a.platform][1] + '">' + PL[a.platform][0] + '</em>' : '') + (a.ovr ? '<span class="o" style="background:' + (TIER[a.tier] || '#c9ced6') + '">' + a.ovr + '</span>' : '') + '</div>';
  }
  function arrivals() { $('arows').innerHTML = (st.arrivals || []).slice(0, 5).map(arrRow).join(''); $('here').textContent = st.here || 0; }
  // ---------- chat ----------
  function chat(a) {
    if (!st || !st.S.chat) return;
    const e = $('empty'); if (e) e.remove();
    const el = document.createElement('div');
    el.className = 'msg' + (a.boss ? ' boss' : '');
    el.style.setProperty('--t', a.boss ? '#e3132c' : TIER[a.tier] || '#c9ced6');
    el.innerHTML = '<div class="ov">' + (a.boss ? '<small>THE</small><b style="font-size:20px">BOSS</b>' : a.ovr ? '<b>' + a.ovr + '</b><small>' + esc(String(a.tier || '').toUpperCase().slice(0, 6)) + '</small>' : '<b>--</b><small>NO CARD</small>') + '</div>' +
      '<div class="bd"><div class="who">' + esc(a.display) + pt(a.platform) + (a.first ? '<em style="background:#f5c400">NEW FACE</em>' : '') + (a.sub ? '<em style="background:#c58bff">SUB</em>' : '') + (a.mod ? '<em style="background:#4dc3ff">MOD</em>' : '') + '</div><div class="tx">' + esc(a.text) + '</div></div>';
    const list = $('list'); list.appendChild(el);
    while (list.children.length > 9) list.removeChild(list.firstChild);
  }
  // ---------- alerts shown on this screen (when set to show here) ----------
  const LAB = { follow: 'NEW FOLLOWER', sub: 'NEW SUB', resub: 'RESUB', gift: 'GIFTED SUBS', bits: 'BITS', kicks: 'KICKS', superchat: 'SUPER CHAT', raid: 'RAID', upgrade: 'CARD UPGRADE', battle: 'BATTLE', newcard: 'NEW CARD', streak: 'STREAK' };
  function alertNext() {
    if (alBusy || !alQ.length) return; alBusy = true;
    const a = alQ.shift(), c = a.card || (a.cards && a.cards[0]) || {};
    if (a.type === 'pack') { a.kind = a.kind === 'follow' ? 'follow' : 'newcard'; a.reason = a.reason || 'New card: OVR ' + (c.ovr || '') + ' ' + String(c.tier || '').toUpperCase(); }
    if (a.type === 'streakup') { a.kind = 'streak'; a.reason = (a.cards || []).map((x) => x.display + ' ' + ((x.streak || {}).now || '') + ' in a row').join(' · '); }
    const el = document.createElement('div'); el.className = 'al'; el.style.setProperty('--t', TIER[c.tier] || '#f5c400');
    el.innerHTML = '<span class="k">' + esc(LAB[a.kind] || 'THANK YOU') + '</span>' + (c.ovr ? '<span class="o">' + c.ovr + '</span>' : '') + '<span class="n">' + esc(String(c.display || '').toUpperCase()) + '<small>' + esc(a.reason || '') + '</small></span>';
    document.body.appendChild(el);
    sfx('impact'); sfx('ding', 0.15); if (c.tier) try { SFX.tierFx(c.tier, 0.3); } catch (e) { /* ignore */ }
    setTimeout(() => el.classList.add('out'), 5600);
    setTimeout(() => { el.remove(); alBusy = false; alertNext(); }, 6100);
  }
  // ---------- kick-off ----------
  function kickoff() { const k = $('ko'); k.classList.remove('on'); void k.offsetWidth; k.classList.add('on'); sfx('whistle', 0, true); sfx('cheer', 0.3, 3); sfx('impact', 0.7); setTimeout(() => k.classList.remove('on'), 7000); }
  // ---------- the BSN ticker along the bottom ----------
  function ticker(on) {
    const want = on ? (HEIST ? 'heist' : ETS ? 'ets' : 'bsn') : '';
    if ((ETS || HEIST) && on) etsTicker();
    if (want === tickerOn) return; tickerOn = want;
    const old = $('tick'); if (old) old.remove();
    const o2 = $('ets-tick'); if (o2) o2.remove();
    if (!on) return;
    if (ETS || HEIST) { const d = document.createElement('div'); d.id = 'ets-tick'; d.innerHTML = '<b>' + (HEIST ? 'COAST NEWS 24' : document.body.dataset.look === 'ats' ? 'CB RADIO' : 'TRAFFIC NEWS') + '</b><div class="run" id="etsrun"></div>'; document.body.appendChild(d); etsTicker(); return; }
    const f = document.createElement('iframe'); f.id = 'tick'; f.src = '/bsn/'; f.title = 'Boss Sports News'; f.setAttribute('allowtransparency', 'true');
    document.body.appendChild(f);
    // the ticker page hides itself unless it's the stream's own; keep it showing here
    setInterval(() => { try { f.contentDocument.body.classList.remove('bsn-hide-ticker'); } catch (e) { /* loading */ } }, 1000);
  }
  // the ETS ticker: a traffic-radio strip made from tonight's numbers
  function etsTicker() {
    const el = $('etsrun'); if (!el || !st) return;
    const top = (st.spot || []).find((x) => x && x.card);
    const L = HEIST ? ['BREAKING: CREW ASSEMBLING ON THE SUNSET COAST', 'SAY HI IN CHAT TO JOIN THE CREW', 'TYPE !CARD TO SEE YOUR CREW FILE', st.cards + ' KNOWN ASSOCIATES ON FILE'] : ['SAY HI IN CHAT TO JOIN THE CONVOY', 'TYPE !CARD TO SEE YOUR CARD', st.cards + ' CARDS IN THE CLUB', 'TRUCK RACE TONIGHT: TYPE !JOIN WHEN IT OPENS'];
    if (top) L.splice(1, 0, esc(top.label) + ': ' + esc(String(top.card.display).toUpperCase()) + ' ' + top.card.ovr);
    if (st.here) L.push(st.here + (HEIST ? ' IN THE CREW SO FAR' : ' IN THE CONVOY SO FAR'));
    const s = L.join('  ·  ') + '  ·  ';
    if (el.dataset.s !== s) { el.dataset.s = s; el.textContent = s + s; }
  }
  // the big title fills the left side but never runs into the chat
  function fitTitle() { const t = $('title'), W = ETS ? 1010 : HEIST ? 1080 : 1150; let fs = 150; t.style.fontSize = fs + 'px'; while (t.scrollWidth > W && fs > 70) { fs -= 4; t.style.fontSize = fs + 'px'; } }
  function apply(a) {
    st = a; skew = (a.now || Date.now()) - Date.now();
    const S = a.S;
    // the look follows the game too: trucks = the motorway, GTA = the sunset coast, otherwise the stream theme
    const LK = a.look || '';
    ETS = LK === 'ets' || LK === 'ats' || (!/^(football|heist)$/.test(LK) && a.theme === 'ets'); HEIST = !ETS && (LK === 'heist' || (LK !== 'football' && a.theme === 'heist'));
    document.body.classList.toggle('ets', ETS); document.body.classList.toggle('heist', HEIST); document.body.dataset.look = LK;
    const W = WD();
    $('bugt').textContent = W.bug; $('kick').textContent = W.kick;
    $('arrt').textContent = W.arrivals; $('heret').textContent = W.here;
    $('chatt').textContent = W.chat; $('chats').textContent = W.chatSub;
    $('kot').textContent = W.go; $('kos').textContent = W.goSub;
    // your own title (Starting soon settings) wins; otherwise the game's title
    $('title').textContent = S.title && S.title !== 'STARTING SOON' ? S.title : W.title; fitTitle(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
    $('tonight').textContent = S.tonight || (a.game ? 'TONIGHT: ' + String(a.game).toUpperCase() : '');
    const so = a.socials || {}, chips = [];
    if (S.socials) { if (so.twitch) chips.push('<span><em style="background:#b98cff">TW</em>twitch.tv/' + esc(so.twitch) + '</span>'); if (so.kick) chips.push('<span><em style="background:#53fc18">KICK</em>kick.com/' + esc(so.kick) + '</span>'); if (so.youtube) chips.push('<span><em style="background:#ff6b6b">YT</em>youtube.com/' + esc(so.youtube) + '</span>'); }
    if (S.cardsStat) { chips.push('<span>' + a.cards + ' CARDS IN THE CLUB</span>'); if (a.result && !ETS && !HEIST) chips.push('<span>' + esc(a.result) + '</span>'); }
    $('chips').innerHTML = chips.join('');
    const h = $('held'); h.classList.toggle('hide', !(a.held > 0)); h.textContent = a.held + ' ALERT' + (a.held === 1 ? '' : 'S') + ' WAITING FOR KICK-OFF';
    $('chat').classList.toggle('hide', !S.chat); $('arr').classList.toggle('hide', !S.arrivals);
    bg(); arrivals(); spot(); clock(); ticker(!!S.ticker);
    // v30: music while the countdown is on (fades out at kick-off)
    MUSIC.set(a.on && !a.ended ? (a.music || {}) : { on: false });
  }
  function load() { fetch('/api/starting').then((r) => r.json()).then(apply).catch(() => setTimeout(load, 3000)); }
  load();
  try {
    const es = new EventSource('/events');
    es.onmessage = (m) => {
      let a; try { a = JSON.parse(m.data); } catch (e) { return; }
      if (a.volume != null) try { SFX.setVolume && SFX.setVolume(a.volume); } catch (e) { /* ignore */ }
      if (a.type === 'starting' && a.action === 'kickoff') { MUSIC.set({ on: false }); return kickoff(); }
      if (a.type === 'music') return MUSIC.event(a);
      if (a.type === 'stinger') return STINGER.play(a, { sound: false });
      if (a.type === 'starting') return apply(a);
      if (a.type === 'theme') { load(); return; }
      if (a.type === 'schat') return chat(a);
      if (a.type === 'sarrive' && st) { st.arrivals = [a.a].concat(st.arrivals || []).slice(0, 12); st.here = a.here; arrivals(); sfx('ding'); return; }
      if (a.type === 'sceneHold') { hold = !!a.hold; return; }
      if ((a.type === 'levelup' || a.type === 'pack' || a.type === 'streakup') && st && st.on && !st.ended && st.S.alerts === 'show' && !hold) { alQ.push(a); alertNext(); }
    };
  } catch (e) { /* no live updates */ }
})();
</script>
</body>
</html>
